<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a></nav>
    <h1>Ejemplo de tabla simple</h1>
    <table border="1">
        <caption>Título de la tabla simple</caption>
        <tr>
            <td>Encabezado 1</td>
            <td>Encabezado 2</td>
            <td>Encabezado 3</td>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
            <td>Celda 3</td>
        </tr>
        <tr>
            <td>Celda 4</td>
            <td>Celda 5</td>
            <td>Celda 6</td>
        </tr>
        <tr>
            <td>Celda 7</td>
            <td>Celda 8</td>
            <td>Celda 9</td>
        </tr>
    </table>

    <h1>Ejemplo de tabla combinada</h1>
    <table border="1">
        <caption>Título de tabla combinada</caption>
        <tr>
            <td colspan="2">Encabezado 1</td>
            <td rowspan="2">Encabezado 3</td>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
        </tr>
        <tr>
            <td colspan="2" rowspan="2">Celda 4</td>
            <td>Celda 5</td>
        </tr>
        <tr>
            <td>Celda 7</td>
        </tr>
    </table>
</body>
</html>
