<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        h1{
            color: #0000FF
        }
        @media screen and (min-width: 500px){
            h1{
                color: #FF0000;
            }
        }
        @media screen and (min-width: 900px){
            h1{
                color: #00FF00;
            }
        }
        @media print{
            h1{
                color: orange;
            }
        }
    </style>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a></nav>
    <h1>Soy una Media Query</h1>
</body>
</html>
