<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear</title>
    <style>
        div{
            border: 1px solid black;
            height: 75px;
        }
        #d3, #d4, #d6{
            float: right;
        }

        #d3 {
            width: 500px;
        }

        #d4 {
            width: 200px;
        }
        #d5 {
            clear: both;
            width: 50px;
        }

    </style>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a></nav>
    <div id="d1">Div1</div>
    <div id="d2">Div2</div>
    <div id="d3">Div3</div>
    <div id="d4">Div4</div>
    <div id="d5">Div5</div>
    <div id="d6">Div6</div>
</body>
</html>
